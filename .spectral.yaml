extends:
  - "spectral:oas"

rules:
  no-real-tokens:
    description: "Interdit les JWT réels ou secrets dans les exemples OpenAPI."
    message: "Ne documentez pas de token réel ou de secret : utilisez des exemples falsifiés."
    severity: error
    given: "$..example"
    then:
      function: pattern
      functionOptions:
        notMatch: "/eyJ[A-Za-z0-9_-]{20,}\\.[A-Za-z0-9_-]{20,}\\.[A-Za-z0-9_-]{20,}|password|secret/i"

  typed-parameters:
    description: "Chaque paramètre doit déclarer un type explicite dans son schema."
    message: "Le paramètre doit avoir un champ schema.type défini."
    severity: error
    given: "$.paths.*.*.parameters[*]"
    then:
      field: "schema.type"
      function: truthy

  string-maxlength:
    description: "Les chaînes de caractères doivent déclarer une longueur maximale."
    message: "Ajoutez maxLength sur les schemas de type string pour limiter la taille des valeurs."
    severity: warn
    given: "$..schema[?(@.type==='string')]"
    then:
      field: "maxLength"
      function: truthy

  problem-details-on-mutations:
    description: "Les opérations de mutation doivent documenter les erreurs via application/problem+json."
    message: "Ajoutez une réponse d'erreur au format application/problem+json pour les opérations POST, PUT, PATCH et DELETE."
    severity: warn
    given: "$.paths.*.post.responses.*"
    then:
      field: "content.application/problem+json"
      function: truthy

  problem-details-on-put:
    description: "Les opérations PUT doivent documenter les erreurs via application/problem+json."
    message: "Ajoutez une réponse d'erreur au format application/problem+json pour les opérations PUT."
    severity: warn
    given: "$.paths.*.put.responses.*"
    then:
      field: "content.application/problem+json"
      function: truthy

  problem-details-on-patch:
    description: "Les opérations PATCH doivent documenter les erreurs via application/problem+json."
    message: "Ajoutez une réponse d'erreur au format application/problem+json pour les opérations PATCH."
    severity: warn
    given: "$.paths.*.patch.responses.*"
    then:
      field: "content.application/problem+json"
      function: truthy

  problem-details-on-delete:
    description: "Les opérations DELETE doivent documenter les erreurs via application/problem+json."
    message: "Ajoutez une réponse d'erreur au format application/problem+json pour les opérations DELETE."
    severity: warn
    given: "$.paths.*.delete.responses.*"
    then:
      field: "content.application/problem+json"
      function: truthy

  bearer-auth-defined:
    description: "Le contrat doit déclarer un securityScheme BearerAuth dans components."
    message: "Ajoutez components.securitySchemes.BearerAuth pour documenter l'authentification JWT."
    severity: error
    given: "$.components.securitySchemes.BearerAuth"
    then:
      function: truthy

