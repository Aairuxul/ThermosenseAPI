openapi: "3.0.3"

servers:
  - url: "http://localhost:3000/v1"
    description: "Serveur de développement local"
  - url: "https://staging-api.thermosense.com/v1"
    description: "Serveur de staging pour tests"
  - url: "https://api.thermosense.com/v1"
    description: "Serveur de production"

info:
  title: ThermoSense API
  version: "1.0.0"
  description: |
    API de gestion de la plateforme ThermoSense —
    supervision de capteurs et pilotage d'actionneurs pour le confort thermique des bâtiments.
    Le controle d'acces combine des scopes JWT, des restrictions par role et des verifications BOLA sur la zone ou la ressource cible.

    ## Versioning et politique d'évolution

    **Stratégie :** versioning par **préfixe d'URI** (`/v1`, `/v2`, ...). Tous les environnements
    (local, staging, production) servent la version courante sous `/v1`. Le numéro majeur
    de l'URI est synchronisé avec le `version` SemVer ci-dessus.

    **Compatibilité ascendante au sein d'une majeure (`/v1`)** : les évolutions suivantes
    sont considérées **non-breaking** et peuvent être publiées sans nouvelle version :
    - Ajout d'un endpoint, d'un champ optionnel en réponse, d'un nouvel `enum` toléré
      par le client (les clients doivent ignorer les champs inconnus).
    - Ajout d'un paramètre de requête optionnel.
    - Ajout d'un nouveau code HTTP 2xx documenté à l'avance.

    Sont considérées **breaking** et nécessitent `/v2` :
    - Suppression ou renommage d'un endpoint, champ, ou valeur d'`enum`.
    - Changement du type d'un champ ou rendu obligatoire d'un champ optionnel.
    - Modification de la sémantique d'un code HTTP existant.

    **Politique de deprecation :** un endpoint ou un champ marqué `deprecated: true`
    dans cette spec reste fonctionnel **6 mois minimum** avant retrait dans la version
    majeure suivante. Le header `Sunset` (RFC 8594) annonce la date de retrait sur
    chaque réponse concernée.

    **Sources de vérité :** ce fichier OpenAPI (`contrat-openapi.yaml`) au commit indiqué
    par `info.version`. Toute modification breaking sans bump de version majeure
    est un bug à signaler.

    ## Politique de rate limiting

    Les quotas sont appliqués par adresse IP source :

    | Catégorie | Quota | Fenêtre |
    |---|---|---|
    | Routes API (toutes sauf `/auth/login`) | 100 req | 1 min |
    | `POST /auth/login` | 10 req | 15 min par IP |

    **Évolution prévue (`/v2`)** : différenciation des quotas par rôle (lectures vs écritures,
    quota dédié pour les capteurs IoT) et application par token JWT en plus de l'IP.

    En cas de dépassement, l'API renvoie `429 Too Many Requests` avec les headers :
    - `Retry-After` : secondes avant le prochain appel autorisé.
    - `X-RateLimit-Limit` : quota total sur la fenêtre.
    - `X-RateLimit-Remaining` : appels restants.
    - `X-RateLimit-Reset` : timestamp epoch de la prochaine remise à zéro.

    Un client mobile doit implémenter un **backoff exponentiel** (1s, 2s, 4s, 8s…) plafonné à `Retry-After`.
  contact:
    name: "Support ThermoSense"
    email: "support@thermosense.com"
 
tags:
  - name: System
    description: Endpoints système pour le monitoring et la santé de l'API.
  - name: Auth
    description: Authentification et gestion des tokens JWT.
  - name: Areas
    description: Opérations liées aux zones (areas) d'un bâtiment.
  - name: Sensors
    description: Opérations liées aux capteurs (sensors).
  - name: AlertThreshold
    description: Gestion des seuils d'alerte pour les zones/capteurs.
  - name: Measures
    description: Création et consultation des mesures (measures) des capteurs.
  - name: Actuators
    description: Gestion des actionneurs (actuators).
  - name: Users
    description: Gestion des utilisateurs (users).

paths:
  /health:
    get:
      tags: [System]
      operationId: healthCheck
      summary: Vérifier l'état de l'API
      description: |
        Endpoint de santé pour vérifier que l'API fonctionne correctement.
        Utile pour le debugging et le monitoring.
      responses:
        "200":
          description: API opérationnelle
          content:
            application/json:
              schema:
                type: object
                required: [status, message, database]
                properties:
                  status:
                    type: string
                    enum: [ok, degraded]
                  message:
                    type: string
                  database:
                    type: string
                    enum: [initialized, initializing, unavailable]
              example:
                status: "ok"
                message: "API is running"
                database: "initialized"

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Se connecter et obtenir un token JWT
      description: |
        Authentifie un utilisateur avec son email et mot de passe.
        Retourne un token JWT à utiliser pour les requêtes authentifiées.
        
        **Compte de test:**
        - Email: `root`
        - Password: `root`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  description: |
                    Email de l'utilisateur. L'identifiant legacy `root` est également
                    accepté pour le compte d'administration de test.
                  example: "admin@thermosense.com"
                password:
                  type: string
                  format: password
                  minLength: 4
                  example: "root"
      responses:
        "200":
          description: Authentification réussie
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token:
                    type: string
                    description: Token JWT à utiliser dans l'en-tête Authorization
                  user:
                    $ref: "#/components/schemas/User"
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJ1c2VyLTIifQ.signature"
                user:
                  id: "user-2"
                  email: "admin@thermosense.com"
                  name: "Alice Admin"
                  role: "admin"
        "400":
          description: Payload invalide
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Email ou mot de passe incorrect
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /areas:
    get:
      tags: [Areas]
      operationId: listAreas
      summary: Lister toutes les zones
      description: |
        Retourne la liste paginée des zones enregistrées dans la plateforme.
        **Requiert une authentification.**

        **Roles autorises:** `admin`, `operator`, `reader`

        - `admin` : acces a toutes les zones
        - `operator`, `reader` : acces limite a leur zone assignee
      security:
        - BearerAuth: []
      x-required-roles: [admin, operator, reader]
      parameters:
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Liste paginée des zones.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AreasListResponse"
              example:
                data:
                  - id: "area-1"
                    name: "Zone A — Entrepôt Nord"
                    buildingId: "building-1"
                    sensors:
                      - id: "sensor-1"
                        type: "temperature"
                        status: "active"
                        areaId: "area-1"
                pagination:
                  limit: 50
                  offset: 0
                  total: 2
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Areas]
      operationId: createArea
      summary: Créer une zone dans un bâtiment.
      description: |
        Créer une zone dans un bâtiment spécifique. La zone doit être associée à un
        bâtiment existant.
        **Requiert une authentification.**

        **Roles autorises:** `admin`
      security:
        - BearerAuth: []
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buildingId, name]
              properties:
                buildingId:
                  type: string
                  pattern: "^building-[0-9]+$"
                  description: Identifiant du bâtiment (format `building-{n}`).
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: Nom de la zone
            example:
              buildingId: "building-1"
              name: "Zone C — Atelier Est"
      responses:
        "201":
          description: Création de la zone avec succès
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Areas"
              example:
                id: "area-3"
                name: "Zone C — Atelier Est"
                buildingId: "building-1"
                sensors: []
        "400":
          description: Payload invalide (buildingId et/ou name manquant)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        
  /sensors/{sensorId}:
    get:
      tags: [Sensors]
      operationId: getSensor
      summary: Obtenir le détail d'un capteur
      description: |
        Retourne les informations détaillées d'un capteur spécifique,
        incluant son type et son statut opérationnel.
        Utilisé par l'application mobile pour superviser un capteur précis.
        **Requiert une authentification.**

        **Roles autorises:** `admin`, `operator`, `reader`, `device`

        - `device` : acces uniquement a son propre capteur
        - `operator`, `reader` : acces limite aux capteurs de leur zone
      security:
        - BearerAuth: []
      x-required-roles: [admin, operator, reader, device]
      parameters:
        - $ref: "#/components/parameters/sensorId"
      responses:
        "200":
          description: Détail du capteur.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sensors"
              example:
                id: "sensor-1"
                type: "temperature"
                status: "active"
                areaId: "area-1"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Capteur introuvable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"



  /areas/{areaId}/alert-thresholds:
    get:
      tags: [AlertThreshold]
      operationId: listAlertThresholds
      summary: Lister les seuils d'alerte d'une zone
      description: |
        Retourne la liste paginée des règles d'alerte configurées pour une zone donnée.
        **Requiert une authentification.**

        **Roles autorises:** `admin`, `operator`, `reader`

        - `operator`, `reader` : acces limite a leur zone assignee
      security:
        - BearerAuth: []
      x-required-roles: [admin, operator, reader]
      parameters:
        - $ref: "#/components/parameters/areaId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Liste paginée des seuils configurés.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertThresholdListResponse"
              example:
                data:
                  - id: "threshold-1"
                    sensorId: "sensor-1"
                    thresholdValue: 30.0
                    comparisonOperator: "greaterThan"
                  - id: "threshold-2"
                    sensorId: "sensor-1"
                    thresholdValue: 10.0
                    comparisonOperator: "lessThan"
                pagination:
                  limit: 50
                  offset: 0
                  total: 2
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Zone introuvable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    post:
      tags: [AlertThreshold]
      operationId: createAlertThreshold
      summary: Créer un seuil d'alerte
      description: |
        Configure une nouvelle règle d'alerte pour une zone.
        La règle déclenche une alerte si la condition est remplie pendant une durée donnée.
        **Requiert une authentification.**

        **Roles autorises:** `admin`, `operator`

        - `operator` : acces limite a sa zone assignee
      security:
        - BearerAuth: []
      x-required-roles: [admin, operator]
      parameters:
        - $ref: "#/components/parameters/areaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertThreshold"
            example:
              sensorId: "sensor-1"
              thresholdValue: 26.5
              comparisonOperator: "greaterThan"
      responses:
        "201":
          description: Seuil d'alerte créé.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertThreshold"
              example:
                id: "threshold-4"
                sensorId: "sensor-1"
                thresholdValue: 26.5
                comparisonOperator: "greaterThan"
        "400":
          description: Payload invalide.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Zone introuvable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"


  /sensors/{sensorId}/measures:
    get:
      tags: [Measures]
      operationId: listMeasurements
      summary: Lister les mesures d'un capteur.
      description: |
        Retourne les mesures associées à un capteur donné.
        Les résultats sont paginés pour limiter le volume de données transférées.
        **Requiert une authentification.**

        **Roles autorises:** `admin`, `operator`, `reader`, `device`

        - `device` : acces uniquement a son propre capteur
        - `operator`, `reader` : acces limite aux capteurs de leur zone

        **Filtres optionnels** : `from`/`to` pour restreindre la fenêtre temporelle.
      security:
        - BearerAuth: []
      x-required-roles: [admin, operator, reader, device]
      parameters:
        - $ref: "#/components/parameters/sensorId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
        - name: from
          in: query
          required: false
          description: Borne basse (incluse) de la fenêtre temporelle, ISO 8601.
          schema:
            type: string
            format: date-time
            example: "2026-05-18T00:00:00Z"
        - name: to
          in: query
          required: false
          description: Borne haute (exclue) de la fenêtre temporelle, ISO 8601.
          schema:
            type: string
            format: date-time
            example: "2026-05-19T00:00:00Z"
      responses:
        "200":
          description: Liste paginée de mesures.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeasuresListResponse"
              example:
                data:
                  - id: "measure-1"
                    sensorId: "sensor-1"
                    timestamp: "2026-05-18T14:23:05Z"
                    value: 21.4
                  - id: "measure-2"
                    sensorId: "sensor-1"
                    timestamp: "2026-05-18T14:24:05Z"
                    value: 21.6
                pagination:
                  limit: 50
                  offset: 0
                  total: 28
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Capteur introuvable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Measures]
      operationId: createMeasurement
      summary: Enregistrer une mesure provenant d'un capteur.
      description: |
        Reçoit une mesure et l'associe au capteur indiqué.
        **Requiert une authentification.**

        **Roles autorises:** `admin`, `device`

        - `device` : acces uniquement a son propre capteur

        **Idempotence obligatoire :** les capteurs IoT en zone à connectivité instable retentent
        l'envoi en cas de timeout. Le header `Idempotency-Key` est requis pour éviter qu'une
        même mesure soit enregistrée plusieurs fois et fausse les agrégats (moyennes, alertes)
        (cf. `components/parameters/IdempotencyKey`).
      security:
        - BearerAuth: []
      x-required-roles: [admin, device]
      parameters:
        - $ref: "#/components/parameters/sensorId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [timestamp, value]
              properties:
                timestamp:
                  type: string
                  format: date-time
                  example: "2026-05-18T14:23:05Z"
                value:
                  type: number
                  example: 21.4
      responses:
        "201":
          description: |
            Mesure créée. Si la requête est un rejeu d'une `Idempotency-Key` déjà traitée
            avec le même body, la mesure existante est renvoyée sans nouvel enregistrement.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Measures"
              example:
                id: "measure-29"
                sensorId: "sensor-1"
                timestamp: "2026-05-18T14:23:05Z"
                value: 21.4
        "400":
          description: Payload invalide.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Capteur introuvable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Conflit. Deux cas possibles, distingués par le champ `code` de la réponse :
            - `idempotencyConflict` : la clé `Idempotency-Key` a déjà été utilisée dans
              les dernières 24 h avec un body différent.
            - `sensorUnavailable` : le capteur est hors ligne ou inactif.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Header `Idempotency-Key` absent ou mal formé (format UUID attendu).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /areas/{areaId}/actuators:
    get:
      tags: [Actuators]
      operationId: listActuators
      summary: Lister les actionneurs d'une zone
      description: |
        Retourne la liste paginée des actionneurs associés à une zone donnée.
        Utilisé pour afficher et gérer les actionneurs d'une zone.
        **Requiert une authentification.**

        **Roles autorises:** `admin`, `operator`, `reader`

        - `operator`, `reader` : acces limite a leur zone assignee
      security:
        - BearerAuth: []
      x-required-roles: [admin, operator, reader]
      parameters:
        - $ref: "#/components/parameters/areaId"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Liste paginée des actionneurs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActuatorsListResponse"
              example:
                data:
                  - id: "actuator-1"
                    type: "heater"
                    state: "on"
                    areaId: "area-1"
                  - id: "actuator-2"
                    type: "ventilation"
                    state: "auto"
                    areaId: "area-1"
                pagination:
                  limit: 50
                  offset: 0
                  total: 2
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Zone introuvable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      tags: [Actuators]
      operationId: createActuator
      summary: Créer un actionneur dans une zone
      description: |
        Crée un nouvel actionneur et l'associe à la zone spécifiée.
        Les détails de l'actionneur sont fournis dans le corps de la requête.
        **Requiert une authentification.**

        **Roles autorises:** `admin`
      security:
        - BearerAuth: []
      x-required-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/areaId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Actuators"
            example:
              id: "actuator-3"
              type: "heater"
              state: "off"
              areaId: "area-1"
      responses:
        "201":
          description: Actionneur créé.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Actuators"
              example:
                id: "actuator-5"
                type: "heater"
                state: "off"
                areaId: "area-1"
        "400":
          description: Payload invalide.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Zone introuvable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /actuators/{actuatorId}:
    get:
      tags: [Actuators]
      operationId: getActuator
      summary: Obtenir le détail d'un actionneur
      description: |
        Retourne les informations détaillées d'un actionneur donné.
        **Requiert une authentification.**

        **Roles autorises:** `admin`, `operator`, `reader`, `device`

        - `device` : acces uniquement a son propre actionneur
        - `operator`, `reader` : acces limite aux actionneurs de leur zone
      security:
        - BearerAuth: []
      x-required-roles: [admin, operator, reader, device]
      parameters:
        - $ref: "#/components/parameters/actuatorId"
      responses:
        "200":
          description: Détail de l'actionneur.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Actuators"
              example:
                id: "actuator-1"
                type: "heater"
                state: "on"
                areaId: "area-1"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Actionneur introuvable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      tags: [Actuators]
      operationId: updateActuator
      summary: Mettre à jour l'état d'un actionneur
      description: |
        Met à jour l'état ou les propriétés d'un actionneur existant.
        Seules les propriétés fournies dans le corps seront modifiées.
        **Requiert une authentification.**

        **Roles autorises:** `admin`, `operator`

        - `operator` : acces limite aux actionneurs de sa zone

        **Idempotence obligatoire :** cette opération modifie l'état physique d'un équipement.
        Le header `Idempotency-Key` est requis pour qu'un client mobile/IoT puisse retenter
        la requête après timeout sans risquer un double basculement de l'actionneur
        (cf. `components/parameters/IdempotencyKey`).
      security:
        - BearerAuth: []
      x-required-roles: [admin, operator]
      parameters:
        - $ref: "#/components/parameters/actuatorId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [on, off, auto]
                  example: on
      responses:
        "200":
          description: |
            Actionneur mis à jour. Si la requête est un rejeu d'une `Idempotency-Key` déjà
            traitée avec le même body, la réponse mémorisée est renvoyée sans nouvelle exécution.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Actuators"
              example:
                id: "actuator-1"
                type: "heater"
                state: "on"
                areaId: "area-1"
        "400":
          description: Payload invalide.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Actionneur introuvable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            Conflit d'idempotence : la clé `Idempotency-Key` fournie a déjà été utilisée
            dans les dernières 24 h avec un body différent. Le client doit générer une
            nouvelle clé ou rejouer exactement le même payload.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            Header `Idempotency-Key` absent ou mal formé (format UUID attendu).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      tags: [Actuators]
      operationId: deleteActuator
      summary: Supprimer un actionneur
      description: |
        Supprime l'actionneur identifié par `actuatorId`.
        **Requiert une authentification.**

        **Roles autorises:** `admin`
      security:
        - BearerAuth: []
      x-required-roles: [admin]
      parameters:
        - $ref: "#/components/parameters/actuatorId"
      responses:
        "204":
          description: Actionneur supprimé.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Actionneur introuvable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /users:
    post:
      tags: [Users]
      operationId: createUser
      summary: Créer un utilisateur
      description: |
        Crée un nouvel utilisateur avec l'email et le nom fournis.
        **Requiert une authentification.**

        **Roles autorises:** `admin`
      security:
        - BearerAuth: []
      x-required-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
            example:
              email: "operator.c@thermosense.com"
              name: "Camille Opératrice"
              role: "operator"
      responses:
        "201":
          description: Utilisateur créé.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: "user-8"
                email: "operator.c@thermosense.com"
                name: "Camille Opératrice"
                role: "operator"
        "400":
          description: Payload invalide.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Email déjà utilisé.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /users/{userId}:
    get:
      tags: [Users]
      operationId: getUser
      summary: Obtenir le détail d'un utilisateur
      description: |
        Retourne les informations publiques d'un utilisateur identifié.
        **Requiert une authentification.**

        **Roles autorises:** `admin`, `operator`, `reader`

        - `admin` : acces a tous les utilisateurs
        - `operator`, `reader` : acces uniquement a leur propre profil
      security:
        - BearerAuth: []
      x-required-roles: [admin, operator, reader]
      parameters:
        - $ref: "#/components/parameters/userId"
      responses:
        "200":
          description: Détail de l'utilisateur.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              example:
                id: "user-3"
                email: "operator.a@thermosense.com"
                name: "Bob Opérateur"
                role: "operator"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Utilisateur introuvable.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  
components:
  parameters:
    areaId:
      name: areaId
      in: path
      required: true
      description: "Identifiant unique de la zone (format `area-{n}`)."
      schema:
        type: string
        pattern: "^area-[0-9]+$"
        example: "area-1"
    sensorId:
      name: sensorId
      in: path
      required: true
      description: "Identifiant unique du capteur (format `sensor-{n}`)."
      schema:
        type: string
        pattern: "^sensor-[0-9]+$"
        example: "sensor-1"
    actuatorId:
      name: actuatorId
      in: path
      required: true
      description: "Identifiant unique de l'actionneur (format `actuator-{n}`)."
      schema:
        type: string
        pattern: "^actuator-[0-9]+$"
        example: "actuator-1"
    userId:
      name: userId
      in: path
      required: true
      description: "Identifiant unique de l'utilisateur (format `user-{n}`)."
      schema:
        type: string
        pattern: "^user-[0-9]+$"
        example: "user-1"
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Clé unique d'idempotence fournie par le client pour sécuriser les retries.

        **Comportement serveur :**
        - Première requête avec cette clé : la requête est traitée normalement, le résultat (status + body) est mémorisé.
        - Rejeu de la même clé avec un body **identique** : le serveur renvoie la réponse mémorisée (même status, même body) sans ré-exécuter l'effet de bord.
        - Rejeu de la même clé avec un body **différent** : `409 Conflict` (la clé est déjà associée à une autre requête).
        - Clé absente ou mal formée : `422 Unprocessable Entity`.

        **Fenêtre de déduplication :** 24 heures à compter de la première requête. Au-delà, la clé peut être réutilisée.

        **Format recommandé :** UUID v4 généré côté client et persisté jusqu'à confirmation de réception.

        **Pourquoi c'est obligatoire :** un client mobile/IoT en perte réseau retente automatiquement après timeout. Sans cette clé, un retry sur une commande actionneur ou un envoi de mesure crée un doublon (double allumage, mesure dupliquée).
      schema:
        type: string
        format: uuid
        minLength: 8
        maxLength: 128
        example: "a3f1c8e2-5b4d-4f9e-a7c6-1d2e3f4a5b6c"
    limit:
      name: limit
      in: query
      required: false
      description: Nombre maximal d'éléments retournés par page.
      schema:
        type: integer
        minimum: 1
        maximum: 499
        default: 50
    offset:
      name: offset
      in: query
      required: false
      description: Position de départ pour la pagination (0-indexé).
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    Unauthorized:
      description: |
        Token d'authentification absent, invalide ou expiré. Le client doit appeler
        `POST /auth/login` pour obtenir un nouveau token.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            type: "about:blank"
            title: "Unauthorized"
            status: 401
            detail: "Token JWT manquant ou expiré."
            code: "unauthorized"
    Forbidden:
      description: |
        Token valide mais rôle insuffisant pour cette opération, ou ressource
        appartenant à une autre zone (vérification BOLA).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            type: "about:blank"
            title: "Forbidden"
            status: 403
            detail: "Le rôle `reader` n'autorise pas la modification d'actionneurs."
            instance: "/actuators/actuator-1"
            code: "forbidden"
    TooManyRequests:
      description: |
        Quota d'appels dépassé. Voir la politique de rate limiting dans la description globale.
        Le header `Retry-After` indique le délai (en secondes) avant le prochain appel autorisé.
      headers:
        Retry-After:
          description: Délai en secondes avant un nouvel appel autorisé.
          schema:
            type: integer
            example: 30
        X-RateLimit-Limit:
          description: Quota total sur la fenêtre.
          schema:
            type: integer
        X-RateLimit-Remaining:
          description: Appels restants sur la fenêtre courante.
          schema:
            type: integer
        X-RateLimit-Reset:
          description: Timestamp epoch (secondes) de remise à zéro du quota.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            type: "https://thermosense.com/errors/rate-limit"
            title: "Too Many Requests"
            status: 429
            detail: "Quota de 120 req/min dépassé sur les endpoints de lecture."
            code: "rateLimitExceeded"
    
  schemas:
    Areas:
      type: object
      description: "Représente une zone dans un bâtiment."
      required:
        - id
        - name
        - buildingId
        - sensors
      properties:
        id:
          type: string
          pattern: "^area-[0-9]+$"
          description: "Identifiant unique de la zone (format `area-{n}`)."
          example: "area-1"
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: "Nom de la zone."
          example: "Zone A — Entrepôt Nord"
        buildingId:
          type: string
          pattern: "^building-[0-9]+$"
          description: "Identifiant du bâtiment auquel la zone appartient (format `building-{n}`)."
          example: "building-1"
        sensors:
          type: array
          description: "Liste des capteurs présents dans la zone."
          items:
            $ref: "#/components/schemas/Sensors"
    Sensors:
      type: object
      description: "Représente un capteur dans une zone."
      required:
        - id
        - type
        - status
        - areaId
      properties:
        id:
          type: string
          pattern: "^sensor-[0-9]+$"
          description: "Identifiant unique du capteur (format `sensor-{n}`)."
          example: "sensor-1"
        type:
          type: string
          enum: [temperature, humidity]
          description: "Type de capteur."
          example: "temperature"
        status:
          type: string
          description: "Statut du capteur."
          enum: [active, inactive, maintenance]
          example: "active"
        areaId:
          type: string
          pattern: "^area-[0-9]+$"
          description: "Identifiant de la zone à laquelle le capteur appartient."
          example: "area-1"
    Actuators:
      type: object
      description: "Représente un actionneur dans une zone."
      required:
        - id
        - type
        - state
        - areaId
      properties:
        id:
          type: string
          pattern: "^actuator-[0-9]+$"
          description: "Identifiant unique de l'actionneur (format `actuator-{n}`)."
          example: "actuator-1"
        type:
          type: string
          enum: [heater, ventilation]
          description: "Type d'actionneur."
          example: "heater"
        state:
          type: string
          description: "État de l'actionneur."
          enum: [on, off, auto]
          example: "on"
        areaId:
          type: string
          pattern: "^area-[0-9]+$"
          description: "Identifiant de la zone à laquelle l'actionneur appartient."
          example: "area-1"
    Measures:
      type: object
      description: "Représente une mesure prise par un capteur."
      required:
        - id
        - sensorId
        - timestamp
        - value
      properties:
        id:
          type: string
          pattern: "^measure-[0-9]+$"
          description: "Identifiant unique de la mesure (format `measure-{n}`)."
          example: "measure-1"
        sensorId:
          type: string
          pattern: "^sensor-[0-9]+$"
          description: "Identifiant du capteur qui a pris la mesure."
          example: "sensor-1"
        timestamp:
          type: string
          format: date-time
          description: "Date et heure de la mesure (ISO 8601)."
          example: "2026-05-18T14:23:05Z"
        value:
          type: number
          description: "Valeur de la mesure prise par le capteur (°C pour temperature, % pour humidity)."
          example: 21.4
    AlertThreshold:
      type: object
      description: "Représente un seuil d'alerte pour un capteur."
      required:
        - sensorId
        - thresholdValue
        - comparisonOperator
      properties:
        id:
          type: string
          pattern: "^threshold-[0-9]+$"
          description: "Identifiant unique du seuil d'alerte (format `threshold-{n}`). Absent en requête, présent en réponse."
          example: "threshold-1"
          readOnly: true
        sensorId:
          type: string
          pattern: "^sensor-[0-9]+$"
          description: "Identifiant du capteur auquel le seuil d'alerte est associé."
          example: "sensor-1"
        thresholdValue:
          type: number
          description: "Valeur du seuil d'alerte."
          example: 30.0
        comparisonOperator:
          type: string
          description: "Opérateur de comparaison pour le seuil d'alerte."
          enum: [greaterThan, lessThan, equalTo]
          example: "greaterThan"
    Error:
      type: object
      description: |
        Réponse d'erreur au format **Problem Details for HTTP APIs (RFC 7807)**.

        Les réponses d'erreur de l'API ThermoSense sont servies avec le media type
        `application/problem+json`. Les clients doivent traiter ce format quel que soit
        le code HTTP non-2xx retourné.

        **Extensions ThermoSense** (au-dessus de RFC 7807) :
        - `code` : identifiant machine-readable de l'erreur métier (`sensorUnavailable`,
          `idempotencyConflict`, `invalidParameter`, etc.) — stable, utilisable pour le routing
          côté client.
        - `errors` : liste des erreurs de validation par champ, présente sur les `400`/`422`.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
          description: |
            URI de référence identifiant le type d'erreur. Utiliser `about:blank`
            quand le code HTTP suffit à identifier la cause.
          example: "https://thermosense.com/errors/sensor-unavailable"
          default: "about:blank"
        title:
          type: string
          description: Résumé court et stable (ne change pas d'une occurrence à l'autre).
          example: "Sensor unavailable"
        status:
          type: integer
          description: Code HTTP, dupliqué ici pour faciliter le logging côté client.
          minimum: 400
          maximum: 599
          example: 409
        detail:
          type: string
          description: Explication contextuelle propre à cette occurrence.
          example: "Le capteur sensor-1 est hors-ligne depuis 2026-05-18T13:00:00Z."
        instance:
          type: string
          format: uri-reference
          description: URI identifiant l'occurrence (typiquement le chemin appelé).
          example: "/sensors/sensor-1/measures"
        code:
          type: string
          description: |
            Code d'erreur métier stable (extension ThermoSense).
            Exemples : `invalidParameter`, `sensorUnavailable`, `idempotencyConflict`,
            `idempotencyKeyMissing`, `rateLimitExceeded`, `forbidden`, `unauthorized`.
          example: "sensorUnavailable"
        errors:
          type: array
          description: |
            Erreurs de validation par champ (extension ThermoSense),
            présentes sur les réponses `400` et `422`.
          items:
            type: object
            required: [field, reason]
            properties:
              field:
                type: string
                description: Chemin du champ en erreur (notation pointée).
                example: "thresholdValue"
              reason:
                type: string
                description: Raison de l'erreur pour ce champ.
                example: "doit être strictement positif"
    PaginationMeta:
      type: object
      description: Métadonnées de pagination retournées avec toute liste.
      required: [limit, offset, total]
      properties:
        limit:
          type: integer
          description: Nombre maximal d'éléments demandé.
          example: 50
        offset:
          type: integer
          description: Position de départ utilisée pour cette page.
          example: 0
        total:
          type: integer
          description: Nombre total d'éléments disponibles côté serveur.
          example: 1440
    AreasListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Areas"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    AlertThresholdListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AlertThreshold"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    MeasuresListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Measures"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    ActuatorsListResponse:
      type: object
      required: [data, pagination]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Actuators"
        pagination:
          $ref: "#/components/schemas/PaginationMeta"
    User:
      type: object
      description: "Utilisateur de la plateforme ThermoSense."
      required: [id, email, role]
      properties:
        id:
          type: string
          pattern: "^user-[0-9]+$"
          description: Identifiant unique de l'utilisateur (format `user-{n}`).
          example: "user-2"
        email:
          type: string
          description: |
            Email de l'utilisateur. Pour les comptes créés via `POST /users`,
            le format email standard est validé. Le compte d'administration
            historique `root` est conservé pour compatibilité.
          example: "admin@thermosense.com"
        name:
          type: string
          description: Nom affiché.
          example: "Alice Admin"
        role:
          type: string
          enum: [admin, operator, reader, device]
          description: Rôle applicatif attribué à l'utilisateur.
    UserCreateRequest:
      type: object
      required: [email, name]
      properties:
        email:
          type: string
          format: email
          description: Email de l'utilisateur.
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Nom affiché.
        role:
          type: string
          enum: [admin, operator, reader, device]
          description: Rôle applicatif (par défaut `reader`).
  
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Authentification JWT. Utilisez le token obtenu via `/auth/login`.
        
        **Pour tester:**
        1. Appelez POST `/auth/login` avec `{"email": "root", "password": "root"}`
        2. Copiez le token retourné
        3. Cliquez sur le bouton "Authorize" 🔒 en haut
        4. Entrez le token (sans le préfixe "Bearer")
        5. Toutes vos requêtes utiliseront automatiquement ce token !
